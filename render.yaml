# Render Blueprint: MNIST inference API for Arcane docs
# Deploy this service, then set MNIST_API_URL on Vercel to the Render service URL.
# Ensure mnist_arcane_model.weights.h5 exists at repo root (train with: python examples/mnist_arcane.py).

services:
  - type: web
    name: arcane-mnist-api
    runtime: python
    region: oregon

    buildCommand: pip install -r requirements.txt
    startCommand: python examples/serve_mnist_api.py

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

  - type: web
    name: arcane-flywire-api
    runtime: python
    region: oregon

    buildCommand: pip install -r requirements-flywire.txt
    startCommand: python examples/serve_flywire_api.py

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    # Optional live FlyWire queries (https://fafbseg-py.readthedocs.io/en/stable/source/tutorials/flywire_setup.html)
    # - key: FLYWIRE_SECRET
    #   sync: false
