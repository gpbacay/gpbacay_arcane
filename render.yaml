# Render Blueprint: ARC 1 inference API for Arcane docs
# Deploy this service, then set ARC1_API_URL on Vercel to the Render service URL.
# Serves Models/arc1_arc1_tiny.* (train with: python examples/train_arc1.py).

services:
  - type: web
    name: arcane-arc1-api
    runtime: python
    region: oregon

    buildCommand: pip install -r requirements.txt
    startCommand: python examples/serve_arc1_api.py
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

  - type: web
    name: arcane-flywire-api
    runtime: python
    region: oregon

    buildCommand: pip install -r requirements-flywire.txt
    startCommand: python examples/serve_flywire_api.py

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    # Optional live FlyWire queries (https://fafbseg-py.readthedocs.io/en/stable/source/tutorials/flywire_setup.html)
    # - key: FLYWIRE_SECRET
    #   sync: false
